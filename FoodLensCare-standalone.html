<style>
/* ============================================================
   食护家 FoodLensCare · 设计令牌
   依据：工信部《移动互联网应用（APP）适老化通用设计规范》
   - 无衬线字体；主要文字 ≥ 18dp/pt；最大字体 ≥ 30dp/pt
   - 行距 ≥ 1.3 倍；段间距 ≥ 行距的 1.3 倍
   - 文本对比度 ≥ 4.5:1；大字号 ≥ 3:1
   - 颜色不得作为唯一信息载体（等级同时用颜色+文字+图标+语音）
   - 主要组件点击区域 ≥ 60×60 dp/pt
   - 禁止广告、插件、随机弹窗与诱导按键

   尺寸策略（重要）：
   html 的 font-size 固定在 16px 不动，布局尺寸（1rem = 16px）保持稳定；
   文字大小由 --fs-scale 单独缩放。若把字号挂到 html font-size 上，
   全站的 rem 尺寸会跟着一起放大，容器宽度会超出手机屏幕。
   ============================================================ */

:root {
  /* ---- 文字缩放系数：由 data-text-size 驱动，只作用于文字 ---- */
  --fs-scale: 1.25;

  /* ---- 品牌与语义色（均为浅底深字，正文对比度 ≥ 7:1） ---- */
  --c-brand: #0F4C81;
  --c-brand-ink: #0A3560;
  --c-brand-soft: #E8F1FA;
  --c-ink: #16202B;
  --c-ink-2: #3A4653;
  --c-ink-3: #5A6673;
  --c-line: #C9D3DE;
  --c-line-soft: #E3E9F0;
  --c-surface: #FFFFFF;
  --c-surface-2: #F4F7FA;
  --c-surface-3: #EAF0F6;

  /* ---- 风险五级：color + label + icon + speech 四重编码 ---- */
  --c-risk-red: #B3261E;      /* 明确命中过敏成分 */
  --c-risk-red-soft: #FBE9E7;
  --c-risk-orange: #9A4A00;   /* 糖/钠显著超出当日剩余额度 */
  --c-risk-orange-soft: #FDF0E2;
  --c-risk-yellow: #7A5A00;   /* 一般性营养结构提示 */
  --c-risk-yellow-soft: #FCF4DC;
  --c-risk-green: #1B5E3A;    /* 未发现与画像明显冲突 */
  --c-risk-green-soft: #E6F2EA;
  --c-risk-gray: #4A5560;     /* 信息不足，请补拍 */
  --c-risk-gray-soft: #EDF0F3;

  /* ---- 体型（固定尺寸，不随字号变化） ---- */
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 20px;
  --space-1: 6px;
  --space-2: 12px;
  --space-3: 18px;
  --space-4: 26px;
  --space-5: 36px;

  --line-height: 1.5;                             /* 行距 1.5 倍 */
  --para-gap: calc(var(--fs-scale) * 1rem * var(--line-height) * 1.3); /* 段间距 = 行距 × 1.3 */

  /* ---- 点击区域：适老版主要组件 ≥ 60×60 dp/pt，主操作 ≥ 96×96 ---- */
  --tap-min: 60px;
  --tap-primary: 96px;

  --shadow-1: 0 1px 2px rgba(16, 32, 48, 0.08), 0 2px 8px rgba(16, 32, 48, 0.06);
  --shadow-2: 0 4px 16px rgba(16, 32, 48, 0.14);
  --focus-ring: 0 0 0 4px #FFD34D;
}

/* 三档字号：正文 20 / 24 / 28.8 px；结论文字为正文 1.6 倍（32 / 38.4 / 46 px） */
html[data-text-size='large']  { --fs-scale: 1.25; }
html[data-text-size='xlarge'] { --fs-scale: 1.5; }
html[data-text-size='huge']   { --fs-scale: 1.8; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ============================================================
   食护家 FoodLensCare · 界面样式
   约束：无衬线字体、单一主线、每屏一个动作、无二级菜单、无弹窗广告

   字号写法：所有文字大小都用 calc(N * var(--fs-scale) * 1rem)，
   这样三档字号只影响文字，不影响布局尺寸（详见 tokens.css 的说明）。
   ============================================================ */

* { box-sizing: border-box; }

html {
  /* 固定 16px：1rem 始终等于 16px，布局尺寸稳定 */
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  padding: 0;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Source Han Sans SC",
    "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
  font-size: calc(1 * var(--fs-scale) * 1rem);
  line-height: var(--line-height);
  color: var(--c-ink);
  background: var(--c-surface-2);
  /* 全站只使用单指点击与上下滑动，禁止双击缩放误触 */
  touch-action: manipulation;
  /* 用 anywhere 而不是 break-word：break-word 不影响 min-content 尺寸计算，
     中文长句在大字号下会把 flex 容器顶宽、溢出手机屏幕 */
  overflow-wrap: anywhere;
  word-break: break-word;
}

.app-shell {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  /* 480px：手机上铺满，平板上居中，不随字号变宽 */
  max-width: 480px;
  margin: 0 auto;
  background: var(--c-surface-2);
}

.view {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  padding: var(--space-3) var(--space-3) calc(var(--tap-primary) + var(--space-4));
  gap: var(--space-3);
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* 图标随字号缩放，保证与文字同步放大 */
.icon {
  width: 1.25em;
  height: 1.25em;
  flex: 0 0 auto;
  vertical-align: -0.18em;
}

/* ---------- 顶部标题区 ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) 0;
}
.topbar h1 {
  flex: 1 1 auto;
  font-size: calc(1.25 * var(--fs-scale) * 1rem);
  line-height: 1.35;
  margin: 0;
  color: var(--c-brand-ink);
  font-weight: 700;
}
.topbar .brand-mark {
  width: 36px; height: 36px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 10px;
  background: var(--c-brand);
  color: #fff;
  font-weight: 700;
  font-size: calc(1.1 * var(--fs-scale) * 1rem);
}

/* ---------- 卡片 ---------- */
.card {
  background: var(--c-surface);
  border: 2px solid var(--c-line-soft);
  border-radius: var(--radius-l);
  padding: var(--space-3);
  box-shadow: var(--shadow-1);
}
.card > * + * { margin-top: var(--para-gap); }
.card-title {
  margin: 0;
  font-size: calc(1.15 * var(--fs-scale) * 1rem);
  line-height: 1.35;
  font-weight: 700;
  color: var(--c-brand-ink);
}

/* ---------- 按钮 ---------- */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap-min);
  padding: 10px 16px;
  font-family: inherit;
  font-size: calc(1 * var(--fs-scale) * 1rem);
  line-height: 1.3;
  font-weight: 700;
  color: #fff;
  background: var(--c-brand);
  border: 2px solid transparent;
  border-radius: var(--radius-m);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
/* 按下反馈：只改背景与描边，绝不移动元素。
   曾经用过 transform: translateY(1px)，在触屏上会让浏览器在 touchend 时
   对不上触摸起点而丢弃这次点击，表现就是「按了没反应」——必须避免。 */
.btn:active { filter: brightness(0.92); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn-icon { font-size: 1.15em; line-height: 1; }

.btn-block { width: 100%; }

/* 主操作按钮：96×96 dp/pt 起步，适老版最小可点区域 */
.btn-huge {
  min-height: var(--tap-primary);
  font-size: calc(1.25 * var(--fs-scale) * 1rem);
  border-radius: var(--radius-l);
  padding: 16px 20px;
  flex-direction: column;
  gap: 6px;
}
.btn-huge .btn-icon { font-size: 1.9em; }

.btn-secondary {
  color: var(--c-brand-ink);
  background: var(--c-surface);
  border-color: var(--c-brand);
}
.btn-ghost {
  color: var(--c-ink-2);
  background: var(--c-surface);
  border-color: var(--c-line);
}
.btn-speak {
  color: var(--c-brand-ink);
  background: #FFE9A8;
  border-color: #E0B84A;
  min-height: var(--tap-primary);
  font-size: calc(1.15 * var(--fs-scale) * 1rem);
}
.btn-row {
  display: flex;
  gap: var(--space-2);
}
.btn-row > .btn { flex: 1 1 0; }

/* ---------- 首个动作页（拍包装） ---------- */
.hero {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
}
.hero-sub {
  font-size: calc(1.05 * var(--fs-scale) * 1rem);
  color: var(--c-ink-2);
  margin: 0;
}
.shutter {
  width: 100%;
  /* 用视口高度限制，避免在大字号下把按钮撑出屏幕 */
  min-height: clamp(150px, 26vh, 230px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: none;
  border-radius: var(--radius-l);
  background: linear-gradient(160deg, #12639F 0%, #0F4C81 60%, #0A3560 100%);
  color: #fff;
  font-family: inherit;
  font-size: calc(1.45 * var(--fs-scale) * 1rem);
  font-weight: 700;
  box-shadow: var(--shadow-2);
  cursor: pointer;
}
.shutter .shutter-icon { font-size: 3.2em; line-height: 1; }
.shutter .shutter-hint { font-size: calc(0.85 * var(--fs-scale) * 1rem); font-weight: 500; opacity: 0.95; }
.shutter:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---------- 逐屏单问题（画像设置） ---------- */
.step-dots {
  display: flex; gap: 8px; justify-content: center;
  list-style: none; margin: 0; padding: 0;
}
.step-dots li {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--c-line);
}
.step-dots li[data-on='1'] { background: var(--c-brand); }

.question {
  font-size: calc(1.4 * var(--fs-scale) * 1rem);
  line-height: 1.4;
  font-weight: 700;
  color: var(--c-ink);
  margin: 0;
}
.question-hint {
  font-size: calc(0.95 * var(--fs-scale) * 1rem);
  color: var(--c-ink-3);
  margin: 0;
}

.option-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}
/* 勾选式大按钮：≥ 60dp/pt，选中态同时用边框、图标、文字表达，不依赖颜色 */
.option {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: var(--tap-min);
  padding: 11px 14px;
  text-align: left;
  font-family: inherit;
  font-size: calc(1.1 * var(--fs-scale) * 1rem);
  font-weight: 600;
  color: var(--c-ink);
  background: var(--c-surface);
  border: 2px solid var(--c-line);
  border-radius: var(--radius-m);
  cursor: pointer;
}
.option .option-mark {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 2px solid var(--c-line);
  border-radius: 8px;
  font-size: 1.2em;
  color: transparent;
  background: var(--c-surface-3);
}
.option[aria-pressed='true'] {
  border-color: var(--c-brand);
  background: var(--c-brand-soft);
  border-width: 3px;
}
.option[aria-pressed='true'] .option-mark {
  color: #fff;
  background: var(--c-brand);
  border-color: var(--c-brand);
}
.option .option-text { flex: 1 1 auto; min-width: 0; }
.option .option-text > span { display: block; }
.option .option-note {
  font-size: calc(0.85 * var(--fs-scale) * 1rem);
  font-weight: 500;
  color: var(--c-ink-3);
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2);
}

/* ---------- 进度（认标签） ---------- */
.progress-wrap {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  text-align: center;
}
.spinner {
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 9px solid var(--c-surface-3);
  border-top-color: var(--c-brand);
  animation: spin 1.1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-text { font-size: calc(1.3 * var(--fs-scale) * 1rem); font-weight: 700; margin: 0; }
.progress-note { font-size: calc(0.95 * var(--fs-scale) * 1rem); color: var(--c-ink-3); margin: 0; }

/* ---------- 结果页 ---------- */
.risk-banner {
  border-radius: var(--radius-l);
  padding: var(--space-3);
  border: 3px solid;
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
}
.risk-banner .risk-icon { font-size: 2.2em; line-height: 1.1; flex: 0 0 auto; display: block; }
.risk-banner .risk-body { flex: 1 1 auto; min-width: 0; }
.risk-level {
  margin: 0;
  font-size: calc(1.15 * var(--fs-scale) * 1rem);
  font-weight: 700;
  letter-spacing: 0.02em;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.risk-headline {
  margin: 8px 0 0;
  font-size: calc(1.6 * var(--fs-scale) * 1rem);   /* 结论文字 ≥ 30dp/pt */
  line-height: 1.45;
  font-weight: 700;
}
.risk-banner[data-level='red']    { background: var(--c-risk-red-soft);    border-color: var(--c-risk-red);    color: #5E120C; }
.risk-banner[data-level='orange'] { background: var(--c-risk-orange-soft); border-color: var(--c-risk-orange); color: #4A2400; }
.risk-banner[data-level='yellow'] { background: var(--c-risk-yellow-soft); border-color: var(--c-risk-yellow); color: #3D2D00; }
.risk-banner[data-level='green']  { background: var(--c-risk-green-soft);  border-color: var(--c-risk-green);  color: #0C3722; }
.risk-banner[data-level='gray']   { background: var(--c-risk-gray-soft);   border-color: var(--c-risk-gray);   color: #23292E; }
.risk-banner .risk-level-label {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  color: #fff;
  font-size: calc(0.9 * var(--fs-scale) * 1rem);
}
.risk-banner[data-level='red'] .risk-level-label    { background: var(--c-risk-red); }
.risk-banner[data-level='orange'] .risk-level-label { background: var(--c-risk-orange); }
.risk-banner[data-level='yellow'] .risk-level-label { background: var(--c-risk-yellow); }
.risk-banner[data-level='green'] .risk-level-label  { background: var(--c-risk-green); }
.risk-banner[data-level='gray'] .risk-level-label   { background: var(--c-risk-gray); }

.meter {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.meter-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px 12px;
  font-size: calc(0.95 * var(--fs-scale) * 1rem); font-weight: 600;
  flex-wrap: wrap;
}
/* 两段文字各自不折断，窄屏上整体换行即可，避免「已吃 0 / mg」这种割裂 */
.meter-head > span { white-space: nowrap; }
.meter-value { font-variant-numeric: tabular-nums; }
.meter-track {
  height: 18px;
  border-radius: 999px;
  background: var(--c-surface-3);
  border: 2px solid var(--c-line-soft);
  overflow: hidden;
}
.meter-fill { height: 100%; background: var(--c-brand); }
.meter-fill[data-tone='over'] { background: var(--c-risk-orange); }
.meter-fill[data-tone='high'] { background: var(--c-risk-red); }

/* 依据展开：每条结论都可追溯 */
details.basis {
  border: 2px solid var(--c-line-soft);
  border-radius: var(--radius-m);
  background: var(--c-surface);
  padding: 0 var(--space-2);
}
details.basis > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: var(--tap-min);
  font-size: calc(1.05 * var(--fs-scale) * 1rem);
  font-weight: 700;
  color: var(--c-brand-ink);
  cursor: pointer;
  list-style: none;
}
details.basis > summary::-webkit-details-marker { display: none; }
details.basis > summary::after { content: '▾'; margin-left: auto; font-size: 1.1em; }
details.basis[open] > summary::after { content: '▴'; }
.basis-list { list-style: none; margin: 0; padding: 0 0 var(--space-2); }
.basis-list > li {
  padding: 10px 0;
  border-top: 2px solid var(--c-line-soft);
  font-size: calc(0.95 * var(--fs-scale) * 1rem);
  line-height: 1.55;
}
.basis-list > li > * + * { margin-top: 4px; }
.basis-tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 6px;
  font-size: calc(0.8 * var(--fs-scale) * 1rem);
  font-weight: 700;
  margin-right: 6px;
}
.basis-tag[data-kind='rule']     { background: #DDEBF7; color: #0A3560; }
.basis-tag[data-kind='model']    { background: #EFE4F7; color: #4A2070; }
.basis-tag[data-kind='conflict'] { background: #FBE0DC; color: #7A1B12; }
.basis-src { color: var(--c-ink-3); font-size: calc(0.85 * var(--fs-scale) * 1rem); display: block; }

.kv-table {
  width: 100%;
  border-collapse: collapse;
  font-size: calc(0.95 * var(--fs-scale) * 1rem);
}
.kv-table th, .kv-table td {
  text-align: left;
  padding: 8px 5px;
  border-bottom: 2px solid var(--c-line-soft);
  vertical-align: top;
  font-weight: 700;
}
.kv-table th { color: var(--c-ink-3); font-weight: 600; width: 42%; }
.kv-table td { font-variant-numeric: tabular-nums; }

.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: calc(0.85 * var(--fs-scale) * 1rem);
  font-weight: 700;
  background: var(--c-surface-3);
  color: var(--c-ink-2);
  border: 2px solid var(--c-line-soft);
}
.pill[data-hit='1'] { background: #FBE0DC; border-color: var(--c-risk-red); color: #7A1B12; }

.ingredient-lines {
  list-style: none; margin: 0; padding: 0;
  font-size: calc(0.95 * var(--fs-scale) * 1rem); line-height: 1.6;
}
.ingredient-lines > li {
  display: flex; gap: 8px;
  padding: 6px 0;
  border-bottom: 2px solid var(--c-line-soft);
}
.ingredient-lines .line-no {

        '白砂糖', '砂糖', '蔗糖', '果葡糖浆', '葡萄糖浆', '麦芽糖浆', '玉米糖浆', '淀粉糖浆',
        '蜂蜜', '焦糖', '糖蜜', '浓缩果汁', '果葡糖', '结晶果糖', '葡萄糖粉', '麦芽糊精'
      ];
      const MILK_MARKERS = ['生牛乳', '牛乳', '羊乳', '乳粉', '奶粉', '乳清', '稀奶油', '乳固体', '发酵乳'];

      function isLactoseOnlySugar(label) {
        const text = `${label.ingredientText || ''}${label.allergenDeclaration || ''}${label.productName || ''}`;
        if (!text) return false;
        const hasMilk = MILK_MARKERS.some((m) => text.includes(m));
        if (!hasMilk) return false;
        return !ADDED_SUGAR_MARKERS.some((m) => text.includes(m));
      }

      function label(value, unit) {
        return `${value} ${unit}`;
      }
















      function evaluate({ label, profile, consumedToday, servingGrams }) {
        if (label.readingOnly) return evaluateReading(label, profile);
        const gray = detectGray(label);
        if (gray.isGray) {
          return buildGray(gray, label);
        }

        const allergens = matchAllergens(label);
        const additives = collectAdditives(
          [label.ingredientText, label.allergenDeclaration].filter(Boolean).join(' ')
        );

        const myAllergens = new Set((profile.allergens || []).filter((a) => a !== 'none'));
        const allergenConflicts = allergens.filter((a) => myAllergens.has(a.allergenId));


        const concernNutrients = new Set();
        const concernNames = [];
        for (const c of profile.concerns || []) {
          const meta = CONCERN_BY_ID.get(c);
          if (!meta) continue;
          concernNames.push(meta.label);
          for (const n of meta.nutrients) concernNutrients.add(n);
        }
        for (const c of profile.conditions || []) {
          const meta = CONDITION_BY_ID.get(c);
          if (!meta) continue;
          if (!concernNames.includes(meta.label)) concernNames.push(meta.label);
          for (const n of meta.nutrients) concernNutrients.add(n);
        }

        const per100g = label.nutritionPer100g || {};





        const lactoseOnly = isLactoseOnlySugar(label);

        const nutrients = [];
        for (const field of NUTRIENT_FIELDS) {
          const limit = DAILY_LIMITS[field.key];
          if (!limit) continue;                                        
          const raw = per100g[field.key];
          const per100 = raw === null || raw === undefined || raw === '' ? NaN : Number(raw);
          if (!Number.isFinite(per100)) continue;
          const amount = scaleIntake(per100, servingGrams);
          const consumed = Number(consumedToday?.[field.key]) || 0;
          const remaining = limit.limit - consumed;
          const evaluated = evaluateNutrient({
            key: field.key,
            amount,
            remaining,
            isConcern: concernNutrients.has(field.key),
            naturalSugarOnly: field.key === 'sugar' && lactoseOnly
          });
          if (evaluated) nutrients.push({ ...evaluated, incompleteToday: Boolean(consumedToday?.unknown?.[field.key]) });
        }

        let level = decideLevel({ allergenConflicts, nutrients });
        let headline = headlineFor({ level, allergenConflicts, nutrients, concernNames, label });
        let advice = adviceFor({ level, allergenConflicts, nutrients });
        if (label.nutritionPartial) {
          const missing = (label.missingFields || []).map(k => NUTRIENT_LABEL[k] || k).join('、');
          if (level === 'green') { level = 'gray'; headline = '已核对部分营养，缺失项目无法判断'; }
          advice = `仅计算您已核对的项目；${missing}未知，不能据此判断完整营养风险。${level === 'gray' ? '' : advice}`;
        }
        if (nutrients.some(n=>n.incompleteToday)) {
          if (level === 'green') { level = 'gray'; headline = '今日记录有缺失，剩余额度无法确定'; }
          advice += ' 今日部分已食用记录缺少营养数据，仅显示已知摄入量，不能确定完整余量。';
        }
        const basis = buildBasis({
          label,
          allergenConflicts,
          nutrients,
          allergens,
          additives,
          gray,
          profile,
          concernNames
        });

        const flags = {};
        for (const n of nutrients) flags[n.key] = n.grade;

        return {
          level,
          headline,
          advice,
          allergenConflicts,
          allAllergens: allergens,
          nutrients,
          additives,
          concernNames,
          basis,
          flags,
          quantity: { servingGrams, basis: label.servingBasis || 'per100g' }
        };
      }




      const CONFIDENCE_FLOOR = 0.7;


      function evaluateReading(label, profile) {
        const gray = detectGray(label);
        const assessment = buildGray(gray, label);
        const allergens = matchAllergens(label);
        const mine = new Set(profile.allergens || []);
        const conflicts = allergens.filter((a) => mine.has(a.allergenId));
        const low = !label.ingredientsConfirmed && (label.ocrConfidence ?? 0) < CONFIDENCE_FLOOR;
        assessment.partial = true;
        assessment.nutritionUnavailable = true;
        assessment.allAllergens = allergens;
        assessment.allergenConflicts = conflicts;
        if (conflicts.length) {
          const names = conflicts.map((a) => a.short).join('、');
          assessment.level = 'red';
          assessment.headline = label.ingredientsConfirmed
            ? `核对的配料含有您过敏的${names}，请别吃`
            : `识别文字疑似含有您过敏的${names}，请先别吃并核对包装`;
          assessment.advice = `${low ? '文字识别把握较低，可能严重漏读。' : ''}请对照包装确认配料和致敏物质提示。营养信息尚未核对，本次不计算摄入量。`;
          assessment.basis.unshift({ kind: 'rule', title: '配料中的过敏冲突',
            lines: conflicts.map((a) => `您的画像设置了${a.short}过敏；${label.ingredientsConfirmed ? '核对后的文字' : 'OCR 文字'}命中「${a.alias}」。`),
            source: '用户过敏画像与配料词典匹配；OCR 文字须对照包装核对' });
        } else if (label.ingredientsConfirmed) {
          assessment.headline = '配料已核对，营养信息仍不足';
          assessment.advice = '核对的文字中未匹配到您的过敏成分，这不代表一定可以吃。可继续填写并核对营养表，再查看营养提醒。';
        } else if (low) {
          assessment.headline = '文字可能严重漏读，请核对或重新拍摄';
          assessment.advice = '识别把握较低，不能依赖这段文字判断食品风险。请先对照包装补齐配料和致敏提示，或重新拍一张清楚的照片。';
        }
        return assessment;
      }

      function detectGray(label) {
        const reasons = [];
        if (label.readingOnly) {
          reasons.push({ code: 'readingOnly', text: '本次已读取照片文字，营养表的列与单位尚未核对，不据此判断摄入量。' });
          if (!label.ingredientText) reasons.push({ code: 'noIngredientTitle', text: '没有找到清晰的配料标题，请查看识别全文或重新拍摄配料表。' });
          return { isGray: true, reasons, hard: reasons };
        }
        if (label.nutritionConfirmed && label.ingredientsConfirmed) {
          const missing = label.missingFields || [];
          return { isGray: false, hard: [], reasons: missing.length ? [{ code:'partialNutrition', soft:true,
            text:`${missing.map(k=>NUTRIENT_LABEL[k] || k).join('、')}没有已核对的数据，对应摄入量无法计算。` }] : [] };
        }
        const criticalKeys = ['energy', 'protein', 'fat', 'carbohydrate', 'sodium'];
        const per100g = label.nutritionPer100g || {};
        const hasNumber = (v) => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
        const present = criticalKeys.filter((k) => hasNumber(per100g[k]));
        const missingNew = ['saturatedFat', 'sugar'].filter((k) => !hasNumber(per100g[k]));

        if (!label.ingredientText && present.length === 0) {
          reasons.push({ code: 'noContent', text: '照片里没有读到配料表或营养成分表。' });
        }
        if (missingNew.length >= 2) {

          reasons.push({
            code: 'missingNewField',
            text: `GB 28050-2025 要求的强制标示项「${missingNew
              .map((k) => NUTRIENT_LABEL[k])
              .join('、')}」都没有读到，标签可能没拍全。`
          });
        } else if (missingNew.length === 1) {

          reasons.push({
            code: 'missingNewField',
            text: `GB 28050-2025 要求的强制标示项「${NUTRIENT_LABEL[missingNew[0]]}」没有读到，可能与包装标示或拍摄角度有关。`,
            soft: true
          });
        }

        const conf = label.confidence || {};
        const lowFields = Object.entries(conf)
          .filter(([, v]) => Number.isFinite(v) && v < CONFIDENCE_FLOOR)
          .map(([k]) => k);
        if (lowFields.length >= 3) {
          reasons.push({
            code: 'lowConfidence',
            text: `有 ${lowFields.length} 个字段没看清（${lowFields
              .slice(0, 3)
              .map((k) => NUTRIENT_LABEL[k] || k)
              .join('、')}等）。`
          });
        }

        if (label.imageQuality?.blurry) {
          reasons.push({ code: 'blurry', text: '照片有点糊，字迹看不清。' });
        }
        if (label.imageQuality?.tooSmall) {
          reasons.push({ code: 'tooSmall', text: '包装在画面里太小，标签占比不够。' });
        }


        const hard = reasons.filter((r) => !r.soft);
        return { isGray: hard.length > 0, reasons, hard };
      }

      function buildGray(gray, label) {
        const level = 'gray';
        const headline = label.readingOnly && label.ingredientText ? '已读取配料表，请对照照片核对' : label.readingOnly && label.rawText ? '已读取照片文字，未找到配料表标题' : label.unavailableReason && !label.imageQuality?.blurry && !label.imageQuality?.tooSmall
          ? '还没有读取到这张照片的配料表' : '照片有点看不清，能再拍一张吗？';
        const advice = label.readingOnly ? '下面是这张照片实际识别出的文字，可以放大和朗读。请核对错字与漏字；需要营养建议时还须核对包装已标示的营养项目和单位。' : label.unavailableReason || '把手机靠近包装背面，让配料表和营养成分表填满画面，光线亮一点再拍一次。';
        return {
          level,
          headline,
          advice,
          allergenConflicts: [],
          allAllergens: [],
          nutrients: [],
          additives: collectAdditives(label.ingredientText || ''),
          concernNames: [],
          basis: [
            {
              kind: 'conflict',
              title: label.readingOnly ? '营养信息为什么仍不足' : '为什么不给结论',
              lines: gray.reasons.map((r) => r.text),
              source: '方案 4.3 灰色等级：承认不知道，比编一个答案更重要'
            },
            {
              kind: 'model',
              title: '本次识别情况',
              lines: [
                `识别到配料表文本长度 ${(label.ingredientText || '').length} 字`,
                label.readingOnly ? `文字识别把握：${Math.round((label.ocrConfidence || 0) * 100)}%；${label.ingredientsConfirmed ? '配料已由用户核对' : '配料尚未核对'}` : `字段置信度：${Object.entries(label.confidence || {})
                  .map(([k, v]) => `${NUTRIENT_LABEL[k] || k} ${(v * 100).toFixed(0)}%`)
                  .join('、') || '无'}`
              ],
              source: '识别通道原始输出'
            }
          ],
          flags: {},
          quantity: { servingGrams: null, basis: 'per100g' },
          grayReasons: gray.reasons
        };
      }




      const DEFAULT_CONCERNS = ['sugar', 'salt', 'fat'];

      function decideLevel({ allergenConflicts, nutrients }) {
        if (allergenConflicts.length) return 'red';
        const levels = nutrients.map((n) => n.level);
        if (levels.includes('orange')) return 'orange';
        if (levels.includes('yellow')) return 'yellow';
        return 'green';
      }







      function headlineFor({ level, allergenConflicts, nutrients, concernNames, label }) {
        const name = label.productName ? `这个${shortName(label.productName)}` : '这个';

        if (level === 'red') {
          const list = allergenConflicts
            .map((a) => `${a.emoji}${a.short}`)
            .join('、');
          const conjunction = allergenConflicts.length > 1 ? '都' : '';
          return `${name}里有${list}，您对${list}${conjunction}过敏，别吃。`;
        }

        if (level === 'orange') {
          const parts = [];
          for (const n of nutrients.filter((x) => x.level === 'orange')) {
            if (n.key === 'sugar' && n.reasons.includes('dailyBudgetUsedUp')) {
              parts.push('这个甜，而且您今天吃过的甜食已经够了');
            } else if (n.key === 'sodium' && n.reasons.includes('dailyBudgetUsedUp')) {
              parts.push('这个咸，而且您今天吃进去的盐已经够了');
            } else {
              parts.push(amountPhrase(n.key, n.ratioOfDaily));
            }
          }
          return `${name}，${parts.join('；')}，要少吃一点。`;
        }

        if (level === 'yellow') {
          const hot = nutrients
            .filter((x) => x.level === 'yellow')
            .sort((a, b) => b.ratioOfDaily - a.ratioOfDaily);
          if (hot.length) {
            const first = hot[0];
            if (first.key === 'sodium') {
              return `${name}可以吃，不过它盐分不低，一份差不多占了您一天限额的 ${percent(
                first.ratioOfDaily
              )}，做菜就别再放盐了。`;
            }
            if (first.key === 'sugar') {
              const mild = first.ratioOfDaily < 0.5;
              return mild
                ? `${name}可以吃，就是糖分不算少，一份占了您一天限额的 ${percent(
                    first.ratioOfDaily
                  )}，今天甜饮料和糕点少来一点。`
                : `${name}可以吃，不过糖不少，占了您一天限额的 ${percent(
                    first.ratioOfDaily
                  )}，今天甜的少来一点。`;
            }
            if (first.key === 'saturatedFat' || first.key === 'fat') {
              return `${name}可以吃，不过油偏多，占了您一天限额的 ${percent(
                first.ratioOfDaily
              )}，别多吃。`;
            }
          }
          return `${name}可以吃，营养上没什么大问题，就是别一次吃太多。`;
        }

        const concernText = concernNames.length ? `跟您关注的${concernNames.join('、')}不冲突` : '';
        return `${name}可以吃${concernText ? '，' + concernText : ''}，配料表里也没看到您过敏的东西。`;
      }

      function shortName(productName) {
        return productName.replace(/（.*?）/g, '').replace(/\(.*?\)/g, '').trim();
      }

      function percent(ratio) {
        const p = ratio * 100;
        if (p >= 300) return `${Math.round(p / 100)} 倍`;
        if (p >= 200) return '两倍还多';
        if (p >= 100) return '一整天的量';
        return `${Math.round(p)}%`;
      }


      function amountPhrase(key, ratio) {
        const noun = { sugar: '糖', sodium: '盐', fat: '油', saturatedFat: '油' }[key] || '这一项';
        const p = ratio * 100;

        if (p >= 100) {
          const feel = { sugar: '这个太甜了，', sodium: '这个太咸了，', fat: '这个太油了，', saturatedFat: '这个太油了，' }[key] || '';
          return `${feel}一份的${noun}就顶了${percent(ratio)}`;
        }
        return `一份的${noun}占了您一天限额的 ${Math.round(p)}%`;
      }



      function adviceFor({ level, allergenConflicts, nutrients }) {
        if (level === 'red') {
          const names = allergenConflicts.map((a) => a.short).join('、');
          return `包装上已经标了「含${names}」。如果实在想吃，先问一下家里人或者医生；同一包也别分给同样过敏的家人。`;
        }
        if (level === 'orange') {
          const hot = nutrients.filter((n) => n.level === 'orange');
          if (hot.some((n) => n.key === 'sugar')) {
            return '今天剩下的时间尽量选不甜的，比如白开水、无糖豆浆。想吃甜的，和家人分着吃一半也行。';
          }
          if (hot.some((n) => n.key === 'sodium')) {
            return '今天剩下两顿吃清淡些，少放盐、少喝汤，多喝点白开水。';
          }
          return '今天剩下的时间吃得清淡些，少油少盐。';
        }
        if (level === 'yellow') {
          const hotYellow = nutrients
            .filter((n) => n.level === 'yellow')
            .sort((a, b) => b.ratioOfDaily - a.ratioOfDaily);
          const firstKey = hotYellow[0]?.key;
          if (firstKey === 'sodium') {
            return '可以正常吃，不过这一天里咸的东西要省着点，做菜少放盐，腌制品和酱菜先放一放。';
          }
          if (firstKey === 'sugar') {
            return '可以正常吃，不过今天甜的（甜饮料、糕点、糖果）少来一点，换着吃水果更好。';
          }
          if (firstKey === 'saturatedFat' || firstKey === 'fat') {
            return '可以正常吃，不过今天做菜少放点油，肥肉和油炸的先少吃。';
          }
          return '可以正常吃，注意一天别超过一两份。';
        }
        return '可以放心吃。记得一天吃的东西杂一点，蔬菜和粗粮也要有。';
      }



      function buildBasis({ label, allergenConflicts, nutrients, allergens, additives, gray, concernNames }) {
        const blocks = [];


        const softReasons = (gray?.reasons || []).filter((r) => r.soft);
        if (softReasons.length) {
          blocks.push({
            kind: 'model',
            title: '这张照片没读全的地方',
            lines: [...softReasons.map((r) => r.text), '缺项会影响判断的完整度，建议再对着包装拍一张更清楚的。'],
            source: 'GB 28050-2025 强制标示项清单'
          });
        }


        const conflictIds = new Set(allergenConflicts.map((a) => a.allergenId));
        blocks.push({
          kind: 'rule',
          title: '过敏原匹配（规则判定，非模型推测）',
          lines: allergens.length
            ? allergens.map((a) => {
                const where =
                  a.evidenceKind === 'ingredient'
                    ? `配料表第 ${a.line ?? '?'} 行「${a.alias}」`
                    : `包装致敏物质提示「${a.alias}」`;
                const mark = conflictIds.has(a.allergenId) ? '【与您冲突】' : '【与您无关】';
                const fuzzy = a.fuzzyOnly ? '（间接写法，置信度略低）' : '';
                return `${a.emoji} ${a.label}：${where} ${mark}${fuzzy}`;
              })
            : ['配料表中未匹配到 GB 7718-2025 附录 D 的八大致敏物质。'],
          source: 'GB 7718-2025《预包装食品标签通则》附录 D'
        });


        if (nutrients.length) {
          blocks.push({
            kind: 'rule',
            title: `营养阈值判断（本次按 ${label.servingLabel || '每 100 g'} 折算）`,
            lines: nutrients.map((n) => {
              const tone = n.gradeText;
              const concernMark = n.isConcern ? '（您关注的方向）' : '';
              return `${n.label} ${n.amount} ${n.unit}，占一天建议上限 ${n.limit} ${n.unit} 的 ${(
                n.ratioOfDaily * 100
              ).toFixed(0)}%，${tone}${concernMark}。`;
            }),
            source: nutrients[0].source
          });
        }


        if (additives.length) {
          blocks.push({
            kind: 'rule',
            title: '配料表里的添加剂是什么（名词翻译，不做安全判定）',
            lines: additives.map((a) => `${a.code} = ${a.name}（${a.use}）`),
            source: 'GB 2760《食品安全国家标准 食品添加剂使用标准》'
          });
        } else {
          blocks.push({
            kind: 'rule',
            title: '配料表里的添加剂是什么',
            lines: ['这份配料表里没有识别到常见的 INS 编码添加剂。'],
            source: 'GB 2760《食品安全国家标准 食品添加剂使用标准》'
          });
        }


        const conf = label.confidence || {};
        blocks.push({
          kind: label.nutritionConfirmed ? 'rule' : 'model',
          title: label.nutritionConfirmed ? '用户核对的标签字段' : '识别置信度（模型推测部分，与规则判定分开）',
          lines: [
            `识别通道：${label.channelLabel || '未知'}`,
            `配料表文本：${label.ingredientText ? `${label.ingredientText.length} 字` : '未读到'}`,
            label.nutritionConfirmed ? '配料和填写的营养值已由用户对照包装核对；未标示或未确认的字段保持未知。' : `字段置信度：${
              Object.entries(conf)
                .map(([k, v]) => `${NUTRIENT_LABEL[k] || k} ${(v * 100).toFixed(0)}%`)
                .join('、') || '无'
            }`,
            concernNames.length
              ? `比对依据：您的画像关注「${concernNames.join('、')}」`
              : '比对依据：您还没有设置关注方向，系统按通用营养建议提示'
          ],
          source: '识别层原始输出 + 本地画像'
        });

        return blocks;
      }








      function selfTest(cases) {
        const results = [];
        const profiles = {
          default: {
            completed: true,
            ageGroup: 'age70',
            concerns: ['sugar', 'salt', 'fat'],
            allergens: ['peanut', 'milk'],
            conditions: [],
            voiceOn: false
          },
          noAllergy: {
            completed: true,
            ageGroup: 'age60',
            concerns: ['sugar'],
            allergens: [],
            conditions: ['diabetes'],
            voiceOn: false
          }
        };

        for (const testCase of cases) {
          const label = {
            productName: testCase.productName,
            ingredientText: testCase.ingredientText,
            allergenDeclaration: testCase.allergenDeclaration || '',

          controller.abort();
          timers.forEach(clearTimeout);
          ctx.setState({ progressPhoto: null });
          ctx.navigate(pending.returnTo || 'home', {}, { replace: true });
        };

        const textEl = h('p', { class: 'progress-text', text: '正在看标签……' });
        const noteEl = h('p', { class: 'progress-note', text: '把照片上的字读出来' });

        fill(view, [
          topbar({ title: '正在看标签' }),
          h('section', { class: 'progress-wrap', 'aria-live': 'polite' }, [

                  h('img', { src: pending.previewUrl, alt: '正在识别的照片' })
                ])
              : null
          ]),
          button({
            label: '取消读取，返回',
            variant: 'ghost',
            block: true,
            onClick: leave
          })
        ]);

        const timers = [];

        processPhoto(pending.file, pending.origin, ctx.state.profile, {
          signal: controller.signal,
          onProgress: (progress) => {
            if (!active()) return;
            textEl.textContent = progress.text;
            noteEl.textContent = progress.note;
          }
        })
          .then((result) => {
            timers.forEach(clearTimeout);
            if (!active()) {
              if (result.photo.previewUrl) URL.revokeObjectURL(result.photo.previewUrl);
              return;
            }

            const wait = Math.max(0, 1200 - (performance.now() - started));
            waitingResult = result;
            timers.push(setTimeout(() => {
              if (!active()) {
                if (result.photo.previewUrl) URL.revokeObjectURL(result.photo.previewUrl);
                return;
              }
              ctx.setState({ result, progressPhoto: null, pendingFile: null });
              waitingResult = null;
              ctx.navigate('result', {}, { replace: true });
            }, wait));
          })
          .catch((error) => {
            timers.forEach(clearTimeout);
            if (!active()) return;
            const message = reportFailure(error);
            fill(view, [
              topbar({ title: '没看成', onBack: leave }),
              h('section', { class: 'card' }, [
                h('h2', { class: 'card-title', text: '这张照片没处理好' }),

              button({

                iconHtml: icon('camera'),
                block: true,
                huge: true,
                onClick: leave
              })
            ]);
          });
        return () => {
          controller.abort();
          timers.forEach(clearTimeout);
          if (waitingResult?.photo.previewUrl) URL.revokeObjectURL(waitingResult.photo.previewUrl);
          if (pending.previewUrl) URL.revokeObjectURL(pending.previewUrl);

      const INTAKE_RELEVANT = ['sugar', 'sodium', 'fat', 'saturatedFat'];














      function reviewLabel(label, { ingredientText, allergenDeclaration = '', nutrients = {}, unit = 'g' }) {
        if (!ingredientText?.trim()) throw new Error('请填写完整配料；没有看清时请重新拍摄。');
        if (!['g', 'ml'].includes(unit)) throw new Error('请选择每 100 克或每 100 毫升。');

        const values = {};
        const confidence = {};
        const filledFields = [];
        const missingFields = [];

        for (const field of NUTRIENT_FIELDS) {
          const raw = nutrients[field.key];
          if (raw == null || String(raw).trim() === '') {
            values[field.key] = null;
            confidence[field.key] = 0;
            missingFields.push(field.key);
            continue;
          }
          const value = Number(raw);
          if (!Number.isFinite(value) || value < 0) {
            throw new Error(`${field.label}请填写大于或等于 0 的数值。`);
          }
          values[field.key] = value;
          confidence[field.key] = 1;
          filledFields.push(field.key);
        }

        const anyFilled = filledFields.length > 0;
        const allFilled = missingFields.length === 0;


        const uncomputable = missingFields
          .filter((key) => INTAKE_RELEVANT.includes(key))
          .map((key) => NUTRIENT_FIELDS.find((f) => f.key === key)?.label || key);

        return {
          ...label,
          ingredientText: ingredientText.trim(),
          ingredientLines: splitIngredientLines(ingredientText),
          allergenDeclaration: allergenDeclaration.trim(),
          ingredientsConfirmed: true,


          readingOnly: !anyFilled,

          nutritionConfirmed: anyFilled,

          nutritionPartial: anyFilled && !allFilled,

          nutritionPer100g: values,
          confidence,
          filledFields,
          missingFields,
          uncomputable,

          declaredPer: 'per100g',
          servingBasis: 'per100g',
          servingUnit: unit,
          servingLabel: unit === 'ml' ? '每 100 毫升' : '每 100 克',
          imageQuality: {},
          unavailableReason: null
        };
      }

            class: 'footnote',
            text: `食护家 FoodLensCare · 食品标签初版 · 当前视口 ${cssWidth}×${cssHeight} CSS px`

      }

      function isActive(channelId) {
        if (channelId === 'http') return Boolean(CONFIG.vision.endpoint);
        if (channelId === 'ocr') return Boolean(CONFIG.huaweiOcr.endpoint && CONFIG.huaweiOcr.ak);
        return true;

    // ── src/pages/scan.js
    "src/pages/scan.js": function (__exports, __require) {











      /* import ../ui/dom.js */ const { h, button, topbar, toast, fill } = __require("src/ui/dom.js");
      /* import ../ui/icons.js */ const { icon } = __require("src/ui/icons.js");
      /* import ../core/flow.js */ const { pickPhoto, reportFailure } = __require("src/core/flow.js");
      /* import ../recognize/config.js */ const { CONFIG } = __require("src/recognize/config.js");









      async function grab(mode, ctx, setBusy) {
        setBusy(true, mode === 'camera' ? '正在打开相机……' : '正在打开相册……');
        try {
          const file = await pickPhoto(mode);
          if (!file) {

            toast('没有选照片。再点一次就能重新拍。', 2600);
            return;
          }
          ctx.setState({ pendingFile: file, pendingOrigin: mode, pendingReturn: 'scan', result: null });
          ctx.navigate('confirm');
        } catch (error) {
          reportFailure(error);
        } finally {
          setBusy(false);
        }
      }








      function renderScan(view, _params, ctx) {
        const status = h('p', { class: 'footnote', text: '拍照或选择照片，然后确认，再查看配料原文。', role: 'status' });
        let busy = false;
        let cameraButton;
        let albumButton;
        const setBusy = (value, message) => {
          busy = value;
          cameraButton.disabled = value;
          albumButton.disabled = value;
          status.textContent = message || '拍照或选择照片，然后确认，再查看配料原文。';
        };
        const choose = (mode) => { if (!busy) return grab(mode, ctx, setBusy); };
        cameraButton = h('button', {
          class: 'shutter', type: 'button', onClick: () => choose('camera'),
          'aria-label': '拍一张食品配料表的照片'
        }, [
          h('span', { class: 'shutter-icon', html: icon('camera') }),
          h('span', { text: '拍配料表' }),
          h('span', { class: 'shutter-hint', text: '让字清楚地占满画面' })
        ]);
        albumButton = button({
          label: '从相册里选一张配料表照片', iconHtml: icon('album'),
          variant: 'secondary', block: true, onClick: () => choose('album')
        });
        fill(view, [
          topbar({
            title: '拍照读取配料表',
            onBack: () => {
              ctx.navigate('home', {}, { replace: true });
            }
          }),

          h('section', { class: 'card hero' }, [
            h('h2', { class: 'card-title', text: '对准配料表拍一张' }),
            h('p', {
              class: 'hero-sub',
              text: '对准包装背面的配料表，让文字清楚地占满画面。读取后可核对配料、查看过敏提醒；需要营养提醒时，可继续核对填写营养表。'
            }),
            cameraButton
          ]),

          albumButton,
          status,
          CONFIG.localOcr.enabled
            ? h('p', { class: 'footnote', text: '支持真实中文文字读取，照片在本机处理。识别后请对照照片核对；反光、小字或弯曲包装可能读错。' })
            : !CONFIG.vision.endpoint && !CONFIG.huaweiOcr.endpoint
            ? h('p', { class: 'error-box', text: '配料表读取服务尚未连接。您可以先拍照、预览和重拍；连接服务后才能读取照片上的真实文字。' })
            : null,

          h('section', { class: 'card' }, [
            h('h3', { class: 'card-title', text: '怎么拍更清楚' }),
            h('ul', { class: 'ingredient-lines' }, [
              h('li', {}, [h('span', { text: '配料表一般在包装背面，靠近营养成分表。' })]),
              h('li', {}, [h('span', { text: '字越大越清楚，可以离近一点，让配料表占满画面。' })]),
              h('li', {}, [h('span', { text: '光线亮一点，别让影子挡住字。' })]),
              h('li', {}, [h('span', { text: '拍糊了也没关系，识别时会让您确认，还能重拍。' })])
            ])
          ]),

          h('p', {
            class: 'footnote',
            text: '拍完先确认清不清楚，再核对识别文字。营养信息不足时不判断摄入量。'
          })
        ]);
      }

    __exports.renderScan = renderScan;
    },

    "src/app.js": function (__exports, __require) {














      /* import ./core/router.js */ const { define, setNotFound, setView, init, navigate, back } = __require("src/core/router.js");

      /* import ./pages/onboarding.js */ const { renderOnboarding } = __require("src/pages/onboarding.js");
      /* import ./pages/home.js */ const { renderHome } = __require("src/pages/home.js");
      /* import ./pages/confirm.js */ const { renderConfirm } = __require("src/pages/confirm.js");
      /* import ./pages/progress.js */ const { renderProgress } = __require("src/pages/progress.js");
      /* import ./pages/result.js */ const { renderResult } = __require("src/pages/result.js");
      /* import ./pages/records.js */ const { renderRecords } = __require("src/pages/records.js");
      /* import ./pages/settings.js */ const { renderSettings, applyTextSize } = __require("src/pages/settings.js");
      /* import ./pages/help.js */ const { renderHelp } = __require("src/pages/help.js");
      /* import ./pages/scan.js */ const { renderScan } = __require("src/pages/scan.js");
      /* import ./ui/dom.js */ const { h, button, topbar } = __require("src/ui/dom.js");
      /* import ./ui/icons.js */ const { icon } = __require("src/ui/icons.js");



      const state = {
        profile: loadProfile(),
        prefs: loadPrefs(),

        pendingFile: null,
        pendingOrigin: 'camera',
        pendingReturn: 'home',

        progressPhoto: null,

        result: null,
      };












      function applyProfileFromUrl() {
        let preset = null;
        try {
          preset = new URLSearchParams(window.location.search).get('profile');
        } catch {
          return;
        }
        if (!preset) return;

        const PRESETS = {

          allergy: {
            completed: true,
            ageGroup: 'age70',
            concerns: ['sugar', 'salt'],
            allergens: ['peanut', 'milk'],
            conditions: [],
            voiceOn: true
          },

          plain: {
            completed: true,
            ageGroup: 'age70',
            concerns: ['salt'],
            allergens: [],
            conditions: ['hypertension'],
            voiceOn: true
          },

          none: {
            completed: true,
            ageGroup: 'age70',
            concerns: [],
            allergens: [],
            conditions: [],
            voiceOn: true
          }
        };
        const next = PRESETS[preset];
        if (!next) return;
        state.profile = { ...next };
        saveProfile(state.profile);
      }








      function applyResetFromUrl() {
        let shouldReset = false;
        try {
          shouldReset = new URLSearchParams(window.location.search).get('reset') === '1';
        } catch {
          return false;
        }
        if (shouldReset) clearRecords();
        return shouldReset;
      }



      const ctx = {
        state,
        navigate,
        back,
        setState(patch) {
          Object.assign(state, patch);
        },
        speak(text) {
          if (!state.profile.voiceOn) return false;
          return speech.speak(text);
        },
        rerender() {
          navigate(currentRoute(), {}, { force: true });
        }
      };

      let lastRoute = 'home';
      function currentRoute() {
        return lastRoute;
      }



      const ROUTES = {
        home: renderHome,
        onboarding: renderOnboarding,
        confirm: renderConfirm,
        progress: renderProgress,
        result: renderResult,
        records: renderRecords,
        settings: renderSettings,
        help: renderHelp,
        scan: renderScan,
      };

      for (const [name, render] of Object.entries(ROUTES)) {
        define(name, (view, params, context) => {
          lastRoute = name;
          hideSpeakerUnless(name === 'result');
          return render(view, params, context);
        });
      }

      setNotFound((view, _params, context) => {
        view.replaceChildren(
          topbar({ title: '页面不存在' }),
          h('section', { class: 'card' }, [
            h('h2', { class: 'card-title', text: '这个页面找不到了' }),
            h('p', { text: '请回到首页重新操作。' })
          ]),
          button({
            label: '回首页',
            iconHtml: icon('home'),
            block: true,
            huge: true,
            onClick: () => context.navigate('home', {}, { replace: true })
          })
        );
      });


      function hideSpeakerUnless(keep) {
        const bar = document.getElementById('speaker');
        if (bar && !keep) bar.hidden = true;
      }



      function boot() {

        applyResetFromUrl();
        applyProfileFromUrl();


        applyTextSize(state.prefs.textSize);
        savePrefs({ ...state.prefs, textSize: state.prefs.textSize });

        setView(document.getElementById('view'));
        init({
          start: state.profile.completed ? 'home' : 'onboarding',
          ctx
        });

        registerServiceWorker();


        window.FoodLensCare = {
          state,
          ctx,

          debug: { pickPhoto, processDemoCase, speak: (text) => speech.speak(text) },
          async selfTest() {
            const [{ selfTest }, { SAMPLE_CASES }] = await Promise.all([
              __require("src/core/rules.js"),
              __require("src/data/sample-labels.js")
            ]);
            const results = selfTest(SAMPLE_CASES);
            console.table(results);
            const failed = results.filter((r) => r.pass === false);
            console.log(failed.length ? `❌ ${failed.length} 条用例不符合预期` : '✅ 全部用例通过');
            return results;
          }
        };
      }


      function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        if (window.location.protocol === 'file:') return;
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .catch((error) => console.info('[FoodLensCare] Service Worker 未注册：', error?.message));
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once: true });
      } else {
        boot();
      }

    },
  };

  var __cache = Object.create(null);

    __cache[id] = exportsObject;
    factory(exportsObject, __require);
    return exportsObject;
  }

  __require("src/app.js");
  window.__FLC_BOOT__.ok = true;
})();
</script>
